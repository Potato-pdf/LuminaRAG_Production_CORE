# =============================================================================
# DOCKER COMPOSE - LUMINA RAG API (Producción Comercial)
# =============================================================================
# Sistema completo con PostgreSQL para autenticación y gestión
# Se conecta a Ollama que está en otro proyecto
# Ambos deben compartir la red: lumina_network
# =============================================================================

version: '3.8'

services:
  # ===========================================================================
  # POSTGRESQL - Base de datos para autenticación y gestión
  # ===========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: lumina_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-lumina_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-lumina_pass_2026}
      - POSTGRES_DB=${POSTGRES_DB:-lumina_rag}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lumina_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lumina_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"  # Exponer para debugging (opcional)

  # ===========================================================================
  # LUMINA RAG API - Aplicación principal
  # ===========================================================================
  lumina_rag:
    build:
      context: .
      dockerfile: Dockerfile
    image: lumina-rag-api:latest
    container_name: lumina_rag_api
    restart: unless-stopped
    ports:
      - "${PORT_LUMINA:-3205}:${PORT_LUMINA:-3205}"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # =======================================================================
      # DATABASE CONFIGURATION
      # =======================================================================
      - DATABASE_URL=postgresql://${POSTGRES_USER:-lumina_user}:${POSTGRES_PASSWORD:-lumina_pass_2026}@postgres:5432/${POSTGRES_DB:-lumina_rag}
      
      # =======================================================================
      # SECURITY & AUTHENTICATION
      # =======================================================================
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      - API_KEY_EXPIRE_DAYS=${API_KEY_EXPIRE_DAYS:-365}
      
      # =======================================================================
      # OLLAMA (LLM) - Servicio externo
      # =======================================================================
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
       
      # LLM Settings
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.1}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-512}
      
      # =======================================================================
      # AWS S3 CONFIGURATION
      # =======================================================================
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      
      # S3 Bucket para documentos
      - S3_BUCKET=${S3_BUCKET:-amzn-s3-rag}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_PREFIX=${S3_PREFIX:-}
      
      # S3 Bucket para índices FAISS
      - S3_FAISS_BUCKET=${S3_FAISS_BUCKET:-amzn-s3-rag}
      - S3_FAISS_REGION=${S3_FAISS_REGION:-us-east-1}
      - S3_FAISS_PREFIX=${S3_FAISS_PREFIX:-faiss_indices/}
      
      # =======================================================================
      # LLAMA CLOUD API
      # =======================================================================
      - LLAMA_CLOUD_API_KEY=${LLAMA_CLOUD_API_KEY}
      
      # =======================================================================
      # EMBEDDING MODEL
      # =======================================================================
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-384}
      
      # =======================================================================
      # CHUNKING CONFIGURATION
      # =======================================================================
      - CHUNK_SIZE=${CHUNK_SIZE:-512}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:-50}
      - CHUNK_WINDOW_SIZE=${CHUNK_WINDOW_SIZE:-3}
      
      # =======================================================================
      # STORAGE PATHS
      # =======================================================================
      - STORAGE_BASE_DIR=${STORAGE_BASE_DIR:-/app/storage}
      - FAISS_DIR=${FAISS_DIR:-/app/storage/faiss_collections}
      - GRAPHS_DIR=${GRAPHS_DIR:-/app/storage/graphs}
      - GRAPH_PATH=${GRAPH_PATH:-/app/storage/graphs/hierarchical_graph.pkl}
      
      # =======================================================================
      # DOCUMENT SOURCE
      # =======================================================================
      - DOCUMENT_SOURCE_TYPE=${DOCUMENT_SOURCE_TYPE:-api}
      - DOCUMENT_PARSER=${DOCUMENT_PARSER:-llama_parse}
      - LOCAL_DOC_DIR=${LOCAL_DOC_DIR:-/app/pdfs}
      
      # =======================================================================
      # MILVUS (Opcional - no usado actualmente)
      # =======================================================================
      - MILVUS_HOST=${MILVUS_HOST:-localhost}
      - MILVUS_PORT=${MILVUS_PORT:-19530}
      - MILVUS_USER=${MILVUS_USER:-}
      - MILVUS_PASSWORD=${MILVUS_PASSWORD:-}
      - MILVUS_COLLECTION=${MILVUS_COLLECTION:-lumina_hierarchical}
      
      # =======================================================================
      # RATE LIMITING
      # =======================================================================
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-60}
      
      # =======================================================================
      # PYTHON
      # =======================================================================
      - PYTHONPATH=/app/src
      - PYTHONUNBUFFERED=1
    
    volumes:
      - ./storage:/app/storage
      - ./logs:/app/logs
    
    networks:
      - lumina_network

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  lumina_network:
    name: ${NETWORK_NAME:-lumina_network}
    external: true  # La red ya existe, creada por el docker-compose de Ollama

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  postgres_data:
    driver: local
