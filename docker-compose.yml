services:
  lumina_rag:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lumina_rag
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=./src
    depends_on:
      - ollama
    # Comando por defecto del Dockerfile (desarrollo con --reload)
    # Para producción, cambia el comando en el Dockerfile descomentando la sección de PROD
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_MODELS=llama3.2
    restart: unless-stopped
networks:
  app_name:
    name: ${NETWORK_NAME}
    external: true
volumes:
  ollama_data: